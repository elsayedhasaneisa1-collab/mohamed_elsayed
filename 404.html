<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>الصفحة غير موجودة | منصة الأستاذ محمد عيسى</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="auth.css">
<style>
  /* ═══════════════════════════════════════════════════════════════
     404 — صفحة غير موجودة
     ═══════════════════════════════════════════════════════════════ */

  body.page-404{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    padding:24px;
    overflow:hidden;
  }

  .error-404{
    width:100%;
    max-width:560px;
    text-align:center;
    position:relative;
    z-index:2;
    animation:errorPop .6s cubic-bezier(.22,.61,.36,1);
  }

  @keyframes errorPop{
    from{opacity:0;transform:scale(.92) translateY(20px);}
    to{opacity:1;transform:none;}
  }

  /* ─── رقم 404 ─── */
  .error-404__code{
    font-family:'Cairo',sans-serif;
    font-size:clamp(6rem, 28vw, 12rem);
    font-weight:900;
    line-height:.9;
    letter-spacing:-.05em;
    background:linear-gradient(180deg,#fff5cf 0%,#e6b800 40%,#8a6a00 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 20px 60px rgba(230,184,0,.3);
    position:relative;
    display:inline-block;
    animation:codeFloat 4s ease-in-out infinite;
  }

  @keyframes codeFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
  }

  /* ─── نبض ذهبي حوالين الرقم ─── */
  .error-404__code::before{
    content:"";
    position:absolute;
    inset:-20px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(230,184,0,.35), transparent 70%);
    filter:blur(40px);
    z-index:-1;
    animation:pulseGlow 3s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%,100%{opacity:.5;transform:scale(1);}
    50%{opacity:1;transform:scale(1.15);}
  }

  /* ─── أيقونة فوق ─── */
  .error-404__icon{
    width:88px;
    height:88px;
    margin:0 auto 20px;
    border-radius:28px;
    display:grid;
    place-items:center;
    font-size:2.4rem;
    color:var(--gold-2);
    background:linear-gradient(160deg,rgba(230,184,0,.18),rgba(230,184,0,.04));
    border:1px solid var(--line);
    box-shadow:
      0 20px 40px -20px rgba(230,184,0,.5),
      inset 0 0 30px rgba(230,184,0,.1);
    position:relative;
    animation:iconBounce 2s ease-in-out infinite;
  }

  .error-404__icon::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:inherit;
    border:1.5px solid rgba(230,184,0,.3);
    animation:ringPulse 2.4s ease-in-out infinite;
  }

  @keyframes iconBounce{
    0%,100%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(-6px) rotate(-3deg);}
  }

  @keyframes ringPulse{
    0%,100%{transform:scale(1);opacity:.4;}
    50%{transform:scale(1.1);opacity:.1;}
  }

  /* ─── العنوان ─── */
  .error-404__title{
    font-family:'Cairo',sans-serif;
    font-size:clamp(1.4rem, 5vw, 2rem);
    font-weight:900;
    margin-bottom:12px;
    color:var(--text);
  }

  .error-404__title span{
    background:linear-gradient(120deg,var(--gold-2),var(--gold),var(--gold-deep));
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleFlow 4s linear infinite;
  }

  @keyframes titleFlow{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }

  /* ─── الوصف ─── */
  .error-404__desc{
    font-size:1rem;
    color:var(--muted);
    line-height:1.8;
    max-width:44ch;
    margin:0 auto 30px;
  }

  /* ─── الأزرار ─── */
  .error-404__actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .error-404__actions .btn{
    min-width:180px;
  }

  /* ─── جزيئات ذهبية ─── */
  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }

  .particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 12px var(--gold);
    opacity:0;
    animation:particleFloat 8s linear infinite;
  }

  @keyframes particleFloat{
    0%{
      opacity:0;
      transform:translateY(100vh) scale(0);
    }
    10%{
      opacity:1;
      transform:translateY(90vh) scale(1);
    }
    90%{
      opacity:.6;
      transform:translateY(10vh) scale(1);
    }
    100%{
      opacity:0;
      transform:translateY(0) scale(0);
    }
  }

  /* ─── لينك الفوتر ─── */
  .error-404__footer{
    margin-top:40px;
    font-size:.82rem;
    color:var(--muted);
  }

  .error-404__footer a{
    color:var(--gold-2);
    font-weight:700;
  }

  /* ─── موبايل ─── */
  @media(max-width:520px){
    .error-404__code{font-size:8rem;}
    .error-404__icon{width:72px;height:72px;font-size:2rem;border-radius:22px;}
    .error-404__desc{font-size:.9rem;}
    .error-404__actions .btn{min-width:140px;flex:1;}
  }
</style>
</head>
<body class="page-auth page-404">

<!-- الخلفية -->
<div class="bg-stage">
  <div class="bg-glow bg-glow--one"></div>
  <div class="bg-glow bg-glow--two"></div>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
  <div class="bg-vignette"></div>
</div>

<!-- جزيئات ذهبية -->
<div class="particles" id="particles"></div>

<!-- المحتوى -->
<main class="error-404">

  <div class="error-404__icon">
    <i class="fa-solid fa-compass"></i>
  </div>

  <div class="error-404__code">404</div>

  <h1 class="error-404__title">
    الصفحة <span>مش موجودة</span> 😕
  </h1>

  <p class="error-404__desc">
    الرابط اللي بتدور عليه مش موجود، أو اتنقل لمكان تاني.
    جرب ترجع للصفحة الرئيسية وتكمل من هناك.
  </p>

  <div class="error-404__actions">
    <a href="login.html" class="btn btn--gold btn--lg">
      <i class="fa-solid fa-house"></i>
      الرئيسية
    </a>
    <button type="button" class="btn btn--line btn--lg" onclick="history.back()">
      <i class="fa-solid fa-arrow-right"></i>
      رجوع
    </button>
  </div>

  <div class="error-404__footer">
    منصة الأستاذ محمد عيسى التعليمية
    <br>
    <span style="font-size:.76rem;">
      صُنع بواسطة
      <a href="https://t.me/sayoda_elgadar" target="_blank" rel="noopener">EL-sayed Hasan</a>
    </span>
  </div>

</main>

<script>
  // ═══ توليد جزيئات ذهبية ═══
  (function createParticles() {
    const container = document.getElementById('particles');
    if (!container) return;

    const count = 25;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';

      // مكان أفقي عشوائي
      p.style.left = Math.random() * 100 + '%';

      // حجم عشوائي
      const size = (Math.random() * 3 + 2).toFixed(1);
      p.style.width = size + 'px';
      p.style.height = size + 'px';

      // تأخير عشوائي
      p.style.animationDelay = (Math.random() * 8).toFixed(2) + 's';

      // مدة عشوائية
      p.style.animationDuration = (Math.random() * 5 + 6).toFixed(1) + 's';

      // شفافية عشوائية
      p.style.opacity = (Math.random() * 0.5 + 0.3).toFixed(2);

      container.appendChild(p);
    }
  })();
</script>

</body>
</html>
